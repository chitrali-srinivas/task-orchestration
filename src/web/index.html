<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mati Carbon · HQ Admin</title>
  <link rel="stylesheet" href="../lib/tokens.css">
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script src="../lib/theme.js"></script>
</head>
<body class="text-sm">
  <div class="flex min-h-screen">
    <aside class="hidden md:flex w-64 shrink-0 flex-col border-r bg-sidebar text-sidebar-foreground">
      <div class="flex items-center gap-2 p-3">
        <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-sidebar-primary text-sidebar-primary-foreground">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </div>
        <div class="leading-tight"><div class="font-semibold">Mati Carbon</div><div class="text-xs text-muted-foreground">Franchise name</div></div>
      </div>
      <nav class="flex-1 px-2 py-2">
        <div class="px-2 pb-1 pt-2 text-xs font-medium text-sidebar-foreground/70">HQ Admin</div>
        <a href="http://localhost:3100/layouts/survey-builder/v1-0" class="flex items-center gap-2 rounded-md px-2 py-2 hover:bg-sidebar-accent hover:text-sidebar-accent-foreground">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>Survey Templates</a>
        <a href="#/seasons" data-nav="seasons" class="flex items-center gap-2 rounded-md px-2 py-2 hover:bg-sidebar-accent hover:text-sidebar-accent-foreground">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Season Management</a>
        <div class="px-2 pb-1 pt-4 text-xs font-medium text-sidebar-foreground/70">Field</div>
        <a href="../mobile/" class="flex items-center gap-2 rounded-md px-2 py-2 hover:bg-sidebar-accent hover:text-sidebar-accent-foreground">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>Surveyor phone</a>
      </nav>
      <div class="border-t p-3">
        <div class="flex items-center gap-2">
          <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-sidebar-accent text-xs font-semibold" id="avatar">HQ</div>
          <div class="leading-tight min-w-0 flex-1">
            <input id="who" placeholder="Your name" class="w-full bg-transparent text-sm font-semibold outline-none placeholder:font-normal placeholder:text-muted-foreground">
            <div class="truncate text-xs text-muted-foreground">HQ Admin</div>
          </div>
        </div>
      </div>
    </aside>
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-14 items-center gap-2 border-b px-4">
        <a href="#/seasons" class="md:hidden font-semibold">Mati Carbon</a>
        <div id="crumbs" class="text-sm text-muted-foreground"></div>
      </header>
      <main id="main" class="flex-1 p-6 max-w-5xl w-full"><p class="py-12 text-center text-muted-foreground">Loading…</p></main>
    </div>
  </div>
  <script type="module" src="./web.js"></script>
</body>
</html>
