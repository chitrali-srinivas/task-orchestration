<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HQ Admin</title>
  <link rel="stylesheet" href="../lib/style.css">
  <style>
    .layout { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
    nav { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; }
    nav a { display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; margin-bottom: 4px; }
    nav a.active { background: var(--box); font-weight: 600; }
    main { padding: 16px 24px; max-width: 1000px; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow: auto; }
    .step { margin-left: 28px; border-left: 2px solid var(--line); padding-left: 16px; }
    .node { display: inline-block; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-weight: 600; }
    .node.start { background: var(--green); color: #fff; border-color: transparent; border-radius: 999px; }
    .cond { font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    .cond b { color: var(--text); }
    .add { font-size: 12px; margin: 8px 0 12px; }
    .q { display: grid; grid-template-columns: 2fr 1fr 70px 2fr 32px 32px; gap: 6px; align-items: center; margin-bottom: 6px; }
    .q input[type=checkbox] { width: auto; }
    .adv { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 6px 10px 10px; background: var(--box); border-radius: 8px; }
    .chip { display: inline-flex; gap: 6px; align-items: center; background: var(--box); border-radius: 999px; padding: 3px 10px; margin: 0 6px 6px 0; }
    .chip button { border: none; background: none; padding: 0; color: var(--muted); }
    .list a { display: block; padding: 10px 12px; border-bottom: 1px solid var(--line); text-decoration: none; }
    .list a:hover { background: var(--box); }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .q { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="layout">
    <nav>
      <h1>HQ Admin</h1>
      <a href="#/templates" id="nav-templates">Survey Templates</a>
      <a href="#/seasons" id="nav-seasons">Season Management</a>
      <a href="../mobile/">Surveyor phone ↗</a>
      <label>You are<input id="who" placeholder="your name"></label>
    </nav>
    <main id="main"><p class="empty">Loading…</p></main>
  </div>
  <script type="module" src="./web.js"></script>
</body>
</html>
