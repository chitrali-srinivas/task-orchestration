<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mati · Surveyor</title>
  <link rel="stylesheet" href="../lib/style.css">
  <style>
    body { background: var(--panel); }
    .phone { max-width: 430px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    @media (min-width: 500px) { .phone { margin: 16px auto; min-height: calc(100vh - 32px); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; } }
    header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; }
    header select { width: auto; border: none; background: none; font-weight: 600; padding: 4px 0; }
    .avatar { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 12px; font-weight: 600; cursor: pointer; }
    .title { padding: 4px 16px 0; font-size: 20px; }
    .tabs { padding: 0 16px; }
    .list { flex: 1; overflow: auto; padding: 0 16px 16px; }
    .task { background: var(--chip); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; }
    .task.upcoming { opacity: .6; cursor: default; }
    .task .top { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    nav { display: flex; border-top: 1px solid var(--line); padding: 8px 0 12px; }
    nav button { flex: 1; border: none; background: none; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); }
    nav button.active { color: var(--text); }
    nav button span { font-size: 20px; }
    .screen { flex: 1; overflow: auto; padding: 0 16px 16px; }
  </style>
</head>
<body>
  <div id="app" class="phone"><p class="empty">Loading…</p></div>
  <script type="module" src="./mobile.js"></script>
</body>
</html>
